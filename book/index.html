<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4e7d4">
<title>A little more of you</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <div class="book-stage" id="bookStage">
    <img class="cover" id="cover" src="cover.png" alt="افتحي الكتاب" tabindex="0" role="button">
    <img class="page" id="currentPage" alt="صفحة من الكتاب">
    <img class="page" id="incomingPage" alt="">
  </div>
  <nav class="controls" aria-label="تقليب صفحات الكتاب">
    <button id="prev" type="button" disabled>السابق</button>
    <span class="counter" id="counter" aria-live="polite">1 / 19</span>
    <button id="next" type="button" disabled>التالي</button>
  </nav>
  <p class="hint" id="hint">اضغطي على غلاف الكتاب لفتحه</p>
  <a class="back" href="../">العودة للبداية</a>
</main>
<script src="app.js"></script>
</body>
</html>
